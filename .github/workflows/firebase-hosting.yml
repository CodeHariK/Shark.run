name: Deploy Hosting

# Live deploy on push to main; ephemeral preview URL on every PR.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: hosting-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SPACESHARKRUN }}
          projectId: spacesharkrun
          # 'live' on push to main (production); PRs get an auto preview channel.
          channelId: ${{ github.event_name == 'push' && 'live' || '' }}
